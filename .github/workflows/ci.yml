name: Checks

# Lint, type check, unit tests and a pipeline dry run on a small fixture.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Lint
        run: ruff check pipeline && ruff format --check pipeline
      - name: Validate ingredients
        env:
          PYTHONPATH: pipeline
        run: python -m pantry_pipeline check-ingredients
      - name: Unit tests (matching, package sizes, fallbacks)
        run: python -m pytest pipeline -q
      - name: Pipeline dry run on the fixture
        env:
          PYTHONPATH: pipeline
        run: >
          python -m pantry_pipeline
          --local-archives pipeline/tests/fixtures/archives
          build --out "$RUNNER_TEMP/dry-run" --no-crawler --today 2026-11-19
