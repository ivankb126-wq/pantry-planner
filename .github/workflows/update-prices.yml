name: Update prices and deploy

# Builds fresh price data and publishes the app to GitHub Pages.
# Runs twice a day, on every push to main, and from the Actions tab
# ("Run workflow").
on:
  schedule:
    # GitHub uses UTC. 08:30 and 14:30 UTC are 09:30 and 15:30 in Zagreb in
    # winter (one hour later in summer). GitHub may start scheduled runs a
    # little late when it is busy.
    - cron: "30 8 * * *"
    - cron: "30 14 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      # The official-site crawler (github.com/senko/cijene-api) is only used
      # when a chain is missing from the cijene.dev archive. It needs Python
      # 3.13, so it gets its own environment. Its code is downloaded at run
      # time and never copied into this repository.
      - uses: actions/setup-python@v6
        id: py313
        with:
          python-version: "3.13"
      - name: Install the official-site crawler (fallback)
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/senko/cijene-api "$RUNNER_TEMP/cijene-api"
          "${{ steps.py313.outputs.python-path }}" -m venv "$RUNNER_TEMP/crawler-venv"
          "$RUNNER_TEMP/crawler-venv/bin/pip" install --quiet httpx beautifulsoup4 lxml openpyxl pydantic python-dotenv
          echo "CIJENE_CRAWLER_DIR=$RUNNER_TEMP/cijene-api" >> "$GITHUB_ENV"
          echo "CIJENE_CRAWLER_PYTHON=$RUNNER_TEMP/crawler-venv/bin/python" >> "$GITHUB_ENV"

      # Our own pipeline runs on Python 3.12 (set up last, so it is the default).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - name: Find the live site address
        id: site
        uses: actions/configure-pages@v5

      - name: Build price data
        id: prices
        env:
          PYTHONPATH: pipeline
        run: >
          python -m pantry_pipeline build
          --out public/data
          --previous-site "${{ steps.site.outputs.base_url }}"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app
        env:
          BASE_PATH: ${{ steps.site.outputs.base_path }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Open an issue if a chain is 3 or more days old
        if: steps.prices.outputs.stale != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STALE: ${{ steps.prices.outputs.stale }}
        run: |
          title="Price data is stale"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh issue create --title "$title" --body "These chains have not updated for 3 or more days: $STALE.

          The app keeps showing their last good prices with the date. Check the latest run of this workflow for details."
          else
            echo "An open issue already exists."
          fi
          echo "::warning title=Stale prices::$STALE"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
