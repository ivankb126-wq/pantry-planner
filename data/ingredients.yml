# Pantry Planner master ingredient list.
#
# Every recipe ingredient must have an entry here. Fields:
#   id            short unique name used by recipes (lowercase, dashes)
#   name          English name shown in the app
#   category      aisle: fruit-veg, meat, fish, dairy, eggs, bakery, grains, legumes,
#                 canned, sauces, oils, spices, baking, nuts, frozen, sweets, drinks
#   storage       where it lives at home: fridge, shelves, freezer
#   unit          g, ml or piece (what recipes measure it in)
#   piece_g       weight of one piece in g (needed for unit: piece)
#   density       g per ml (only for liquids measured in ml, default 1)
#   staple        true for pantry basics (oil, salt, flour...)
#   package       icon on the pantry shelf: jar, box, bag, bottle, can, pack, loose, carton, tube
#   packages      typical package sizes in the ingredient's unit
#   loose         true if the shops also sell it by weight (price per kg)
#   edible        part you actually eat (bones, shells, peel), for nutrition. Default 1
#   edible        part you actually eat (bones, shells, peel), for nutrition. Default 1
#   shelf_life_days  how long it keeps once bought (fresh food only)
#   nutrition     per 100 g (per 100 ml for unit ml): kcal, protein, carbs (without fibre),
#                 sugar, fat, sat_fat, fibre, salt. Approximate values from standard food tables.
#   match         Croatian search words for the store price files:
#                   include: product matches if ANY rule matches (all words of that rule present)
#                   exclude: product is skipped if ANY rule matches
#                 Case and diacritics do not matter. A word ending in * matches any
#                 ending: "PILE*" matches PILEĆI, PILEĆA, PILEĆE.

